AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  SDIT account service — the Card. Passwordless sign-in (email code) and
  cloud sync of student work. One DynamoDB table, one Lambda, one HTTP API.

Parameters:
  SessionSecret:
    Type: String
    NoEcho: true
    Description: HMAC secret for signing session tokens. Generate with `openssl rand -hex 32`.
  MailFrom:
    Type: String
    Default: ''
    Description: >
      SES-verified From address for sign-in code emails (e.g. no-reply@sandiegotech.org).
      Leave blank to log codes to CloudWatch instead of sending email (useful before SES is set up).
  AllowOrigin:
    Type: String
    Default: 'https://learn.sandiegotech.org,http://localhost:3001'
    Description: Comma-separated browser origins allowed to call the API (CORS).
  SiteDistributionId:
    Type: String
    Default: E1JN5MG0GX1HU4
    Description: >
      The learn.sandiegotech.org CloudFront distribution (sdit-learn-web stack),
      allowed to read the published prefix of the work bucket at /work/p/*.

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 30
    MemorySize: 256
    Architectures: [arm64]

Resources:
  AccountTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: sdit-account
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # The files behind the made things (see src/lib/files.mjs). Private: the
  # browser reads and writes a learner's own files over links the function
  # signs, and only the published prefix p/ is readable by the site's
  # distribution. Browsers upload straight to the bucket, so it needs CORS.
  WorkBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-work'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ['https://learn.sandiegotech.org', 'http://localhost:3001']
            AllowedMethods: [GET, HEAD, PUT]
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: abandoned-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 2

  WorkBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WorkBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: 's3:GetObject'
            Resource: !Sub '${WorkBucket.Arn}/p/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistributionId}'

  # CORS is handled in the function (see src/lib/http.mjs) against the
  # ALLOW_ORIGIN allow-list, so the API itself needs no CORS config.
  HttpApi:
    Type: AWS::Serverless::HttpApi

  AccountFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: index.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref AccountTable
          SESSION_SECRET: !Ref SessionSecret
          MAIL_FROM: !Ref MailFrom
          ALLOW_ORIGIN: !Ref AllowOrigin
          WORK_BUCKET: !Ref WorkBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AccountTable
        - S3CrudPolicy:
            BucketName: !Ref WorkBucket
        - Statement:
            - Effect: Allow
              Action: ['ses:SendEmail']
              Resource: '*'
      Events:
        Any:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

Outputs:
  WorkBucketName:
    Description: The files behind the made things. The site stack reads this to serve /work/p/*.
    Value: !Ref WorkBucket
  WorkBucketDomain:
    Description: Origin domain for the site distribution's /work/* behavior.
    Value: !GetAtt WorkBucket.RegionalDomainName
  ApiUrl:
    Description: Base URL for the account API. Set this as window.SDIT_ACCOUNT_API in partials/header.html.
    Value: !GetAtt HttpApi.ApiEndpoint
