name: Checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Pin the build deps so the drift-check rebuild matches the committed HTML.
      - run: pip install pyyaml==6.0.3 markdown==3.9 pytest

      - name: Validate catalog
        run: python scripts/validate.py

      - name: Unit tests
        run: pytest -q scripts/tests

      # The account service, end to end against in-memory AWS stand-ins.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Account service tests
        run: node --import ./account/test/hooks.mjs --test account/test/handler.test.mjs

      - name: Built site is committed (no drift)
        run: |
          python scripts/build_site.py --out .
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Committed site is out of date. Run 'python3 scripts/build_site.py --out .' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi
