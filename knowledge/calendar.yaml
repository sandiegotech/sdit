__meta__:
  title: The Publishing Calendar
  description: >
    When each week of the Path publishes. One week of the degree per calendar
    week, on Mondays: every course in a semester advances together. Week 1 of
    Semester 1 is already live and carries no date; Week 2 publishes on
    first_release, and every later week follows at the cadence, shifted by
    any breaks.
  intended_use: >
    Read by scripts/publishing.py. Drives the publish dates on the Path page,
    each course's Daily Path, the browser catalog, and the lesson rail.
    Change dates here and nowhere else.

publishing:
  first_release: 2027-01-04   # Monday. Semester 1, Week 2.
  cadence_days: 7
  # A break pushes every later week back. Example:
  #   - {after: {semester: 1, week: 15}, weeks: 2}
  breaks: []

semesters:
  - {n: 1, label: "Year 1 · Fall",   weeks: 15}
  - {n: 2, label: "Year 1 · Spring", weeks: 15}
  - {n: 3, label: "Year 2 · Fall",   weeks: 15}
  - {n: 4, label: "Year 2 · Spring", weeks: 15}
  - {n: 5, label: "Year 3 · Fall",   weeks: 15}
  - {n: 6, label: "Year 3 · Spring", weeks: 15}
  - {n: 7, label: "Year 4 · Fall",   weeks: 15}
  - {n: 8, label: "Year 4 · Spring", weeks: 15}
